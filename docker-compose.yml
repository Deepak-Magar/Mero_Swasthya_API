# Local infrastructure for the Mero Swasthya API.
# Postgres is published on 5433 (not 5432) so it never collides with a natively installed server;
# the default connection string in appsettings.json points at 127.0.0.1:5433.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swc
      POSTGRES_PASSWORD: swc
      POSTGRES_DB: swc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swc -d swc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
